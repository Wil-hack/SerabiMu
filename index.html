<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Serabimu — Kuliner Autentik</title>
<meta name="description" content="Serabimu — kelezatan autentik dalam setiap gigitan. Resep warisan penuh cinta.">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-title:'Playfair Display',serif;
    --font-body:'Inter',sans-serif;
    --radius:22px; --radius-sm:14px;
    --transition:.35s cubic-bezier(.2,.8,.2,1);
  }
  body[data-theme="noir"]{--bg:#0a0a0b;--bg-2:#0f0f12;--card:#141418;--card-2:#1a1a20;--accent:#1a6b4f;--accent-soft:#7fc9a8;--text:#f0f5f2;--muted:#8a9a92;--border:rgba(127,201,168,.15);--glow:rgba(26,107,79,.25);--grad:linear-gradient(100deg,#7fc9a8,#1a6b4f);}
  body[data-theme="sapphire"]{--bg:#0a1120;--bg-2:#0d1526;--card:#111a2e;--card-2:#15203a;--accent:#a8b8d8;--accent-soft:#e6ebf5;--text:#f5f8ff;--muted:#7f8aa8;--border:rgba(192,200,214,.15);--glow:rgba(168,184,216,.2);--grad:linear-gradient(100deg,#e6ebf5,#7f8aa8);}
  body[data-theme="rose"]{--bg:#1a0d10;--bg-2:#211216;--card:#281418;--card-2:#2f181d;--accent:#c98b7a;--accent-soft:#e8b8a8;--text:#f5e6e0;--muted:#a88a82;--border:rgba(201,139,122,.2);--glow:rgba(201,139,122,.22);--grad:linear-gradient(100deg,#e8b8a8,#c98b7a);}
  body[data-theme="copper"]{--bg:#0c0c0e;--bg-2:#111114;--card:#16161a;--card-2:#1c1c22;--accent:#b87333;--accent-soft:#e8a860;--text:#f0e6dc;--muted:#9a8a7a;--border:rgba(184,115,51,.2);--glow:rgba(184,115,51,.22);--grad:linear-gradient(100deg,#e8a860,#b87333);}
  body[data-theme="ivory"]{--bg:#faf6ef;--bg-2:#f0e8db;--card:#ffffff;--card-2:#fdfbf7;--accent:#b8912f;--accent-soft:#8a6d1f;--text:#2e2418;--muted:#8a7a62;--border:rgba(184,145,47,.25);--glow:rgba(184,145,47,.15);--grad:linear-gradient(100deg,#b8912f,#8a6d1f);}
  body[data-theme="purple"]{--bg:#0e0714;--bg-2:#140a1c;--card:#1a0d24;--card-2:#21102d;--accent:#a34fde;--accent-soft:#e2b8ff;--text:#f7ebff;--muted:#a38db8;--border:rgba(226,184,255,.15);--glow:rgba(163,79,222,.25);--grad:linear-gradient(100deg,#e2b8ff,#a34fde);}

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background var(--transition),color var(--transition);}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% -10%,var(--glow),transparent 70%),radial-gradient(ellipse 40% 30% at 100% 100%,var(--glow),transparent 70%);opacity:.9;}
  ::selection{background:var(--accent-soft);color:var(--bg);}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{font-family:var(--font-title);font-size:23px;font-weight:700;letter-spacing:.4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:baseline;gap:8px;}
  .brand span{font-family:var(--font-body);font-size:9px;font-weight:500;letter-spacing:3.5px;color:var(--muted);-webkit-text-fill-color:var(--muted);text-transform:uppercase;}
  nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  nav a{color:var(--muted);text-decoration:none;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;transition:all .3s;font-weight:500;padding:8px 11px;border-radius:999px;}
  nav a:hover{color:var(--accent-soft);background:var(--bg-2);}
  .nav-icon{background:var(--bg-2);border:1px solid var(--border);color:var(--accent-soft);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s;position:relative;}
  .nav-icon svg{width:17px;height:17px;}
  .nav-icon:hover{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--glow);}
  .cart-count{position:absolute;top:-4px;right:-4px;background:#ff4757;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg);}
  .theme-dropdown{position:relative;}
  .theme-btn svg{transition:transform .35s;}
  .theme-dropdown.open .theme-btn svg{transform:rotate(45deg);}
  .theme-dropdown.open .theme-btn{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--glow);}
  .theme-menu{position:absolute;top:48px;right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transition:.3s cubic-bezier(.2,.8,.2,1);transform-origin:top right;box-shadow:0 20px 50px -12px rgba(0,0,0,.7);z-index:200;min-width:250px;}
  .theme-dropdown.open .theme-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
  .theme-menu button{display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--text);padding:9px 11px;border-radius:10px;cursor:pointer;font-family:var(--font-body);font-size:11.5px;text-align:left;transition:.25s;white-space:nowrap;}
  .theme-menu button:hover,.theme-menu button.active{background:var(--bg-2);color:var(--accent-soft);}
  .theme-menu button.active{box-shadow:inset 0 0 0 1px var(--border);}
  .swatch{width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.2);flex-shrink:0;}
  .swatch[data-c="noir"]{background:linear-gradient(135deg,#0a0a0b 50%,#1a6b4f 50%);}
  .swatch[data-c="sapphire"]{background:linear-gradient(135deg,#0a1120 50%,#a8b8d8 50%);}
  .swatch[data-c="rose"]{background:linear-gradient(135deg,#1a0d10 50%,#c98b7a 50%);}
  .swatch[data-c="copper"]{background:linear-gradient(135deg,#0c0c0e 50%,#b87333 50%);}
  .swatch[data-c="ivory"]{background:linear-gradient(135deg,#faf6ef 50%,#b8912f 50%);}
  .swatch[data-c="purple"]{background:linear-gradient(135deg,#0e0714 50%,#a34fde 50%);}

  /* HERO */
  .hero{text-align:center;padding:70px 20px 40px;position:relative;animation:fadeUp .8s ease both;}
  .badge-open{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-soft);background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--border);padding:7px 16px;border-radius:999px;margin-bottom:20px;font-weight:600;}
  .badge-open .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.5);animation:pulse 2s infinite;}
  .badge-open.closed .dot{background:#f87171;box-shadow:0 0 0 0 rgba(248,113,113,.5);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5);}70%{box-shadow:0 0 0 8px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}
  .hero .eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--accent-soft);margin-bottom:14px;font-weight:500;opacity:.9;}
  .hero h1{font-family:var(--font-title);font-size:clamp(38px,6vw,64px);font-weight:700;line-height:1.05;letter-spacing:-.5px;background:linear-gradient(180deg,var(--text) 0%,var(--accent-soft) 140%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px;}
  .hero p{color:var(--muted);max-width:480px;margin:0 auto 28px;font-weight:300;font-size:15px;}
  .hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn-hero{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;transition:.3s;border:1px solid transparent;cursor:pointer;font-family:var(--font-body);}
  .btn-hero.primary{background:var(--grad);color:var(--bg);box-shadow:0 8px 30px -10px var(--glow);}
  .btn-hero.primary:hover{transform:translateY(-2px);filter:brightness(1.08);}
  .btn-hero.ghost{background:var(--bg-2);color:var(--text);border-color:var(--border);}
  .btn-hero.ghost:hover{border-color:var(--accent-soft);color:var(--accent-soft);}

  /* SECTION TITLE */
  .section-title{text-align:center;margin-bottom:24px;padding:0 20px;}
  .section-title h2{font-family:var(--font-title);font-size:clamp(24px,3.5vw,32px);font-weight:600;color:var(--text);letter-spacing:-.3px;}
  .section-title p{color:var(--muted);font-size:13px;letter-spacing:.4px;margin-top:6px;}

  /* KATALOG */
  .catalog-wrap{margin:20px 0 60px;animation:fadeUp .8s .1s ease both;}
  .catalog-toolbar{max-width:640px;margin:0 auto 10px;padding:0 24px;display:flex;flex-direction:column;gap:12px;}
  .search-box{position:relative;display:flex;align-items:center;}
  .search-box svg{position:absolute;left:16px;width:17px;height:17px;color:var(--muted);pointer-events:none;}
  .search-box input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:12px 18px 12px 44px;color:var(--text);font-family:var(--font-body);font-size:13.5px;outline:none;transition:.3s;}
  .search-box input:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--glow);}
  .category-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
  .category-chips::-webkit-scrollbar{display:none;}
  .chip{background:var(--bg-2);border:1px solid var(--border);color:var(--muted);padding:7px 15px;border-radius:999px;font-size:11.5px;font-weight:500;cursor:pointer;transition:.25s;white-space:nowrap;font-family:var(--font-body);}
  .chip:hover{color:var(--accent-soft);border-color:var(--accent-soft);}
  .chip.active{background:var(--grad);color:var(--bg);border-color:transparent;font-weight:700;}

  .catalog-slider{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 24px 26px;scrollbar-width:none;}
  .catalog-slider::-webkit-scrollbar{display:none;}
  .product-card{flex:0 0 min(280px,78vw);scroll-snap-align:start;background:linear-gradient(165deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .4s;display:flex;flex-direction:column;position:relative;}
  .product-card:hover{transform:translateY(-6px);border-color:var(--accent-soft);box-shadow:0 24px 50px -20px rgba(0,0,0,.6),0 0 0 1px var(--border);}
  .product-img-wrap{position:relative;overflow:hidden;}
  .product-img{width:100%;height:180px;object-fit:cover;display:block;transition:transform .6s ease;background:var(--bg-2);}
  .product-card:hover .product-img{transform:scale(1.07);}
  .product-price-badge{position:absolute;top:12px;right:12px;background:var(--grad);color:var(--bg);font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:6px 12px;border-radius:999px;box-shadow:0 6px 20px -6px var(--glow);}
  .product-body{padding:18px;display:flex;flex-direction:column;flex:1;}
  .product-title{font-family:var(--font-title);font-size:17.5px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.3;}
  .product-desc{font-size:12.5px;color:var(--muted);font-weight:300;margin-bottom:16px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .product-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;}
  .product-price{font-weight:700;font-size:15px;color:var(--accent-soft);}
  .btn-cart{background:var(--grad);color:var(--bg);border:none;padding:9px 15px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;transition:.3s;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);}
  .btn-cart:hover{filter:brightness(1.12);transform:scale(1.04);}
  .btn-cart.added{background:var(--accent-soft);}
  .skeleton-card{flex:0 0 min(280px,78vw);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
  .skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .skeleton-card .s-img{height:180px;}
  .skeleton-card .s-body{padding:18px;}
  .skeleton-card .s-line{height:12px;margin-bottom:10px;border-radius:6px;}
  .skeleton-card .s-line.short{width:60%;}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;width:100%;}
  .empty-state svg{width:44px;height:44px;opacity:.4;margin-bottom:12px;}

  /* FEED */
  .feed-wrap{max-width:640px;margin:0 auto;padding:0 20px 70px;animation:fadeUp .8s .2s ease both;}
  .feed{display:flex;flex-direction:column;gap:26px;}
  .post{background:linear-gradient(165deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .35s,box-shadow .4s;animation:fadeUp .6s ease both;}
  .post:hover{border-color:color-mix(in srgb,var(--accent-soft) 40%,var(--border));}
  .post-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px;}
  .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-weight:700;color:var(--bg);font-size:18px;box-shadow:0 4px 14px -4px var(--glow);}
  .post-head .name{font-weight:600;font-size:14.5px;color:var(--text);display:flex;align-items:center;gap:5px;}
  .verified{width:15px;height:15px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;color:var(--bg);font-size:9px;font-weight:700;}
  .post-head .time{font-size:11.5px;color:var(--muted);}
  .post-menu{margin-left:auto;display:flex;gap:6px;}
  .post-menu button{background:transparent;border:1px solid transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;transition:.25s;display:flex;align-items:center;justify-content:center;}
  .post-menu button:hover{background:var(--bg-2);color:var(--accent-soft);border-color:var(--border);}
  .post .caption{padding:0 22px 14px;font-size:14.5px;font-weight:300;color:var(--text);opacity:.94;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .post-location{padding:0 22px 14px;font-size:12px;color:var(--accent-soft);display:flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;transition:.2s;}
  a.post-location:hover{text-decoration:underline;}
  .post-media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#000;}
  .post-media-grid img,.post-media-grid video{width:100%;height:230px;object-fit:cover;display:block;cursor:pointer;transition:opacity .2s;background:#111;}
  .post-media-grid img:hover{opacity:.92;}
  .post-actions{padding:12px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);gap:10px;flex-wrap:wrap;}
  .action-group{display:flex;gap:8px;align-items:center;}
  .btn-like{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:.25s;font-weight:500;font-family:var(--font-body);}
  .btn-like:hover{background:var(--border);color:var(--accent-soft);transform:scale(1.03);}
  .btn-like.liked{color:#ff4757;border-color:rgba(255,71,87,.35);background:rgba(255,71,87,.08);}
  .btn-like.pop{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.18);}100%{transform:scale(1);}}
  .btn-share{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:11.5px;display:inline-flex;align-items:center;gap:5px;transition:.25s;font-family:var(--font-body);}
  .btn-share:hover{color:var(--accent-soft);border-color:var(--accent-soft);}
  .comment-count{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;}
  .comments{padding:16px 22px 20px;background:color-mix(in srgb,var(--bg) 55%,transparent);}
  .comments .c-head{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-soft);margin-bottom:14px;font-weight:600;}
  .comment{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .comment-row{display:flex;gap:10px;align-items:flex-start;}
  .comment .avatar{width:30px;height:30px;font-size:12px;flex-shrink:0;}
  .comment .bubble{background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:9px 13px;flex:1;min-width:0;}
  .comment .cname{font-size:12px;font-weight:600;color:var(--accent-soft);}
  .comment .ctext{font-size:13px;font-weight:300;color:var(--text);opacity:.9;margin-top:2px;word-break:break-word;white-space:pre-wrap;}
  .comment .c-meta{display:flex;gap:12px;font-size:11px;margin-top:5px;align-items:center;}
  .comment .btn-reply-trigger{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;font-weight:500;padding:0;transition:.2s;font-family:var(--font-body);}
  .comment .btn-reply-trigger:hover{color:var(--accent-soft);}
  .comment-replies{margin-left:38px;border-left:1.5px dashed var(--border);padding-left:12px;margin-top:6px;}
  .reply-chip{display:none;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid var(--border);color:var(--accent-soft);font-size:11.5px;padding:6px 12px;border-radius:999px;margin-bottom:8px;width:fit-content;font-weight:500;}
  .reply-chip.show{display:inline-flex;}
  .reply-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.7;}
  .reply-chip button:hover{opacity:1;}
  .comment-form{display:flex;gap:8px;margin-top:12px;}
  .comment-form input{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:999px;padding:10px 16px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:.3s;min-width:0;}
  .comment-form input:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--glow);}
  .comment-form button{background:var(--grad);color:var(--bg);border:none;border-radius:999px;padding:0 18px;font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;transition:.3s;}
  .comment-form button:hover{filter:brightness(1.1);transform:scale(1.03);}

  /* CART DRAWER */
  .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:500;opacity:0;visibility:hidden;transition:.35s;}
  .cart-overlay.open{opacity:1;visibility:visible;}
  .cart-drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--bg);border-left:1px solid var(--border);z-index:501;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5);}
  .cart-drawer.open{transform:translateX(0);}
  .cart-head{display:flex;align-items:center;justify-content:space-between;padding:22px;border-bottom:1px solid var(--border);}
  .cart-head h3{font-family:var(--font-title);font-size:22px;font-weight:600;}
  .cart-close{background:var(--bg-2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.25s;}
  .cart-close:hover{color:var(--accent-soft);border-color:var(--accent-soft);transform:rotate(90deg);}
  .cart-body{flex:1;overflow-y:auto;padding:16px 22px;}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .cart-item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg-2);}
  .cart-item-info{flex:1;min-width:0;}
